<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="RankPro">
  <title>RankPro</title>
  <!--
    Favicon de RankPro.
    Marca geometrica derivada del isotipo (barras ascendentes + linea de tendencia)
    de public/images/rankpro-logo-black.png.
    Fondo solido con el verde de marca (variable brand: #0F9D6E, resources/css/web/app.css)
    y trazos en blanco: legible tanto en pestanas de tema claro como oscuro.
  -->
  <rect width="32" height="32" rx="7" fill="#0F9D6E"/>
  <g fill="#FFFFFF">
    <rect x="6" y="21" width="4.5" height="5" rx="1.2"/>
    <rect x="13.75" y="19" width="4.5" height="7" rx="1.2"/>
    <rect x="21.5" y="17" width="4.5" height="9" rx="1.2"/>
  </g>
  <polyline points="6,18.5 13,14 24,8.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="8.5" r="2.4" fill="#FFFFFF"/>
</svg>
